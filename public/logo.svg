<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Cape May Dispatch lighthouse</title>
  <defs>
    <linearGradient id="tower" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b8c7d8" />
      <stop offset="0.48" stop-color="#f5fbff" />
      <stop offset="1" stop-color="#8ca0b4" />
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#71f3ff" stop-opacity=".95" />
      <stop offset="1" stop-color="#00a9d4" stop-opacity=".55" />
    </linearGradient>
    <clipPath id="tower-shape">
      <path d="M209 441 229 214h54l20 227z" />
    </clipPath>
  </defs>

  <!-- Broad, directional light beams; the mark contains no eye motif. -->
  <g fill="none" stroke="#00e5ff" stroke-linecap="round">
    <path d="M224 103 112 45" stroke-width="12" opacity=".72" />
    <path d="M288 103 400 45" stroke-width="12" opacity=".72" />
    <path d="M216 128 71 111" stroke-width="6" opacity=".42" />
    <path d="M296 128 441 111" stroke-width="6" opacity=".42" />
  </g>

  <!-- Lantern roof and gallery. -->
  <path d="m203 127 15-18h76l15 18-9 8h-88z" fill="#111a27" stroke="#00e5ff" stroke-width="6" stroke-linejoin="round" />
  <path d="M222 137h68v53h-68z" fill="url(#glass)" stroke="#dffaff" stroke-width="5" />
  <path d="M238 140v47m36-47v47M216 190h80l13 13h-106z" fill="none" stroke="#dffaff" stroke-width="5" stroke-linejoin="round" />
  <path d="M252 78h8v30h-8z" fill="#dffaff" />
  <path d="M239 204h34l4 10h-42z" fill="#00d9f5" />

  <!-- Cape May's recognizable black-and-white striped tower. -->
  <path d="M209 441 229 214h54l20 227z" fill="url(#tower)" stroke="#e5f7ff" stroke-width="6" stroke-linejoin="round" />
  <g clip-path="url(#tower-shape)" fill="#101722">
    <path d="M218 236h77l-4 42h-77z" />
    <path d="M214 322h89l4 42h-97z" />
    <path d="M208 408h103l5 42H204z" />
  </g>
  <path d="M227 256h58M222 300h66M218 344h73M214 388h82" fill="none" stroke="#667789" stroke-width="3" opacity=".72" />
  <path d="M195 443h122l12 17H183z" fill="#101722" stroke="#00e5ff" stroke-width="5" stroke-linejoin="round" />

  <!-- A compact plinth keeps the tower legible at app-icon sizes. -->
  <path d="M167 466h178" stroke="#00e5ff" stroke-width="7" stroke-linecap="round" opacity=".86" />
</svg>
