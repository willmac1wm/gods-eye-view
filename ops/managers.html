<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Managers · Cape Ops · God's Eye View</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="ops-main">
    <header class="ops-hero">
      <p class="ops-kicker">Auth-gated</p>
      <h1>Managers</h1>
      <p>Review queue, doctrine, and roster tools from Fire Wire. Requires <code>CAPE_MANAGER_TOKEN</code> on the host — not part of the public Cape proxy.</p>
    </header>

    <section class="ops-panel" id="auth-panel">
      <h2>Sign in</h2>
      <p class="ops-status" id="auth-status" role="status"></p>
      <div class="ops-row">
        <div class="ops-field" style="min-width:16rem;flex:1">
          <label for="token">Manager token</label>
          <input id="token" type="password" autocomplete="current-password" />
        </div>
        <button class="ops-btn" id="sign-in" type="button">Unlock</button>
        <button class="ops-btn" id="sign-out" type="button">Lock</button>
      </div>
      <p class="ops-note">Token stays in this browser tab’s session storage only. Evidence uploads and billing stay blocked.</p>
    </section>

    <section class="ops-panel" id="desk" hidden>
      <h2>Desk</h2>
      <p class="ops-status" id="status" role="status"></p>
      <div class="ops-row">
        <button class="ops-btn" data-mgr="status" type="button">Status</button>
        <button class="ops-btn" data-mgr="summary" type="button">Summary</button>
        <button class="ops-btn" data-mgr="queue" type="button">Queue</button>
        <button class="ops-btn" data-mgr="review" type="button">Review</button>
        <button class="ops-btn" data-mgr="doctrine" type="button">Doctrine</button>
        <button class="ops-btn" data-mgr="members" type="button">Members</button>
      </div>
      <pre id="out" class="ops-pre"></pre>
    </section>
  </main>
  <script type="module" src="/src/ops/managers.js"></script>
</body>
</html>
