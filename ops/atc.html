<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATC · Cape Ops · God's Eye View</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    #atc-chart { height: min(52vh, 420px); width: 100%; border: 1px solid var(--cape-line, #2a6); border-radius: 4px; background: #0a0a0f; }
    .atc-chart-tools { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .atc-alert { color: #fbbf24; }
    audio.atc-audio { width: 100%; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main class="ops-main">
    <header class="ops-hero">
      <p class="ops-kicker">Air traffic</p>
      <h1>ATC</h1>
      <p>VFR / IFR charts, Cape air picture, LiveATC Icecast listen + transcript (old Cape Dispatch program). Tracks stay on the globe.</p>
    </header>

    <section class="ops-panel">
      <h2>Status</h2>
      <p class="ops-status" id="status" role="status"></p>
      <div id="alerts"></div>
    </section>

    <section class="ops-panel">
      <h2>Charts</h2>
      <div class="atc-chart-tools">
        <button class="ops-btn" type="button" id="chart-vfr" aria-pressed="true">VFR sectional</button>
        <button class="ops-btn" type="button" id="chart-ifr" aria-pressed="false">IFR low</button>
      </div>
      <div id="atc-chart" role="img" aria-label="Aviation chart"></div>
    </section>

    <section class="ops-panel"><h2>Air picture</h2><div id="air"></div></section>

    <section class="ops-panel">
      <h2>ATC radio</h2>
      <div id="feeds"></div>
      <audio class="atc-audio" id="player" controls preload="none"></audio>
    </section>

    <section class="ops-panel"><h2>Transcript</h2><div id="transcript"></div></section>
  </main>
  <script type="module" src="/src/ops/atc.js"></script>
</body>
</html>
