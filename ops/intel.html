<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intel · Cape Ops · God's Eye View</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="ops-main">
    <header class="ops-hero">
      <p class="ops-kicker">Lab suite</p>
      <h1>Intel</h1>
      <p>TDOA, Doppler, webcam FFT, dark targets, Maven, and KMZ/KML parse — old /api/intel tools live here.</p>
    </header>

    <section class="ops-panel"><h2>Status</h2><p class="ops-status" id="status" role="status"></p></section>
    <section class="ops-panel"><h2>Tooling</h2><div id="tools"></div></section>
    <section class="ops-panel">
      <h2>KMZ / KML parse</h2>
      <div class="ops-row">
        <div class="ops-field"><label for="kml">File</label><input id="kml" type="file" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" /></div>
        <button class="ops-btn" id="parse" type="button">Parse</button>
      </div>
      <div id="kml-out"></div>
    </section>
  </main>
  <script type="module" src="/src/ops/intel.js"></script>
</body>
</html>
