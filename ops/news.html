<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News · Cape Ops · God's Eye View</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="ops-main">
    <header class="ops-hero">
      <p class="ops-kicker">Wire</p>
      <h1>News</h1>
      <p>Board wire and news collectors — distinct from Social platform posts. Official chips stay on Board.</p>
    </header>

    <section class="ops-panel">
      <h2>Status</h2>
      <p class="ops-status" id="status" role="status"></p>
      <div class="ops-row">
        <button class="ops-btn" id="refresh" type="button">Refresh</button>
        <a class="ops-btn" href="/ops/board" style="text-decoration:none;display:inline-flex;align-items:center">Board</a>
        <a class="ops-btn" href="/ops/social" style="text-decoration:none;display:inline-flex;align-items:center">Social</a>
      </div>
    </section>

    <section class="ops-panel">
      <h2>Feed</h2>
      <div id="feed"></div>
    </section>
  </main>
  <script type="module" src="/src/ops/news.js"></script>
</body>
</html>
